name: Core tests and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opencode-plugin:
    name: OpenCode plugin lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Plugin tests without a model or OpenCode profile
        run: node --experimental-strip-types --test tests/opencode-plugin.test.mjs
  pi-extension:
    name: Pi extension lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Extension tests without a model or Pi profile
        run: node --experimental-strip-types --test tests/pi-extension.test.mjs
  core:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.7.12"
          python-version: ${{ matrix.python }}
      - name: Install core and test dependencies
        run: uv sync --locked --dev
      - name: Core tests without audio or downloaded model
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: uv run --no-sync pytest -q
      - name: Build and smoke-test installed wheel
        shell: bash
        run: |
          uv build
          uv venv .wheel-venv
          uv pip install --python .wheel-venv/bin/python dist/*.whl
          .wheel-venv/bin/awaitonal demo --out /tmp/awaitonal-ci.wav
          .wheel-venv/bin/awaitonal classify --text "Implemented the fix and all tests pass." --json
