# Same-meaning alternatives. Variation 0 is the original state above; these
# three full patches are variations 1..3. Each supplies its own duration and
# complete events list. Omit long_turn to inherit the original state's lift
# and chord. Set variations = [] on a state to keep only its original phrase.
# Rendering matches every choice to the original gesture's RMS before applying
# the normal master gain and peak limit. No instrument, tuning, or effect changes.

