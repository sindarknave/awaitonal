decay_scale = 0.80
release_scale = 1.3
max_decay = 0.130
max_note_duration = 0.36

[voices.crystal]
harmonics = [1.0, 2.0, 5.0, 7.0, 11.0]
harmonic_weights = [1.0, 0.11, 0.49, 0.28, 0.14]
partial_decay = 0.10
attack_scale = 0.60
decay_scale = 0.75
release_scale = 1.3
max_decay = 0.120
max_note_duration = 0.36

[voices.flute]
harmonics = [1.0, 2.0, 3.0]
harmonic_weights = [1.0, 0.10, 0.035]
partial_decay = 0.05
attack_scale = 1.05
decay_scale = 0.85
release_scale = 1.3
max_decay = 0.135
max_note_duration = 0.36

[classification]
caveats_threshold = 0.5

[notifications]
# Cycle authored same-meaning phrases for done/answer; other cues stay fixed.
gesture_variations = true
# Choose the fuller phrase group after this many matched elapsed seconds.
variation_full_after_seconds = 120
# Opt in to stable instruments, rotating as new sessions arrive.
session_voices = false
# Optional subset/order; active sessions get an unused voice whenever possible.
voice_cycle = ["marimba", "powersaw", "harp", "clarinet", "crystal", "flute"]
# Suppress only routine completion cues with a matched prompt start/stop pair.
# Zero disables suppression. Missing or ambiguous turn IDs always play.
min_turn_seconds = 0
# Optional extended ending after a matched elapsed turn; zero disables extension.
# This measures time waiting for the turn, not time spent reasoning.
long_turn_seconds = 0
# Ongoing background work normally stays silent. Enable its small pulse here.
notify_in_flight = false

