# Longer elapsed turns keep the opening motif, then add two rising notes and
# a wider held ending. These voicings are independent of character brightness.
[states.done.long_turn]
lift = ["G4", "B4"]
chord = ["C4", "E4", "G4", "C5"]

[states.answer.long_turn]
lift = ["G4", "C5"]
chord = ["E4", "G4", "C5", "D5"]

[states.verdict.long_turn]
